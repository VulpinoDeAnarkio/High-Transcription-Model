[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "high-transcription-model"
version = "1.0.0"
description = "Lokalna transkrypcja nagrań audio/wideo z identyfikacją mówców"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["whisper", "transcription", "diarization", "speech"]
dependencies = [
    "faster-whisper>=1.1.1,<2",
    "librosa>=0.10.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "soundfile>=0.12",
    "gradio>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
htm = "htm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
